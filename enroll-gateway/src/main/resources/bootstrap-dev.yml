spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: enroll-pro
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
      config:
        server-addr: 127.0.0.1:8848
        namespace: enroll-pro
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
        file-extension: yml
        shared-configs:
          - data-id: common.yaml
            group: DEFAULT_GROUP
          - data-id: shared.yaml
            group: DEFAULT_GROUP
    sentinel:
      enabled: true
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: 127.0.0.1:8718
        port: 8719 #默认8719，假如被占用了会自动从8719开始依次+1扫描。直至找到未被占用的端口
      # nacos配置持久化
      datasource:
        GW_FLOW:
          nacos:
            server-addr: 127.0.0.1:8848
            namespace: enroll-pro
            groupId: DEFAULT_GROUP
            username: nacos
            password: nacos
            dataId: sentinel-gateway-gw-flow
            data-type: json
            rule-type: GW_FLOW
        DEGRADE:
          nacos:
            server-addr: 127.0.0.1:8848
            namespace: enroll-pro
            groupId: DEFAULT_GROUP
            username: nacos
            password: nacos
            dataId: sentinel-gateway-degrade
            data-type: json
            rule-type: DEGRADE
        SYSTEM:
          nacos:
            server-addr: 127.0.0.1:8848
            namespace: enroll-pro
            groupId: DEFAULT_GROUP
            username: nacos
            password: nacos
            dataId: sentinel-gateway-system
            data-type: json
            rule-type: SYSTEM